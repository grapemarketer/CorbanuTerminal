name: security-ingress-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/security-ingress-contract.yml"
      - "BUILD.bazel"
      - "MODULE.bazel.lock"
      - "codex-rs/Cargo.lock"
      - "codex-rs/Cargo.toml"
      - "codex-rs/content-security/**"
      - "qa/security-levels/ingress-contract/**"
      - "qa/security-levels/classifier/**"
      - "qa/security-levels/planning/openclaw-2026-08-28/source-manifest.json"
      - "qa/security-levels/sprints/PF-34-S04/**"
      - "qa/security-levels/sprints/PF-35-S01/**"
      - "scripts/security-classifier-eval"
      - "scripts/security_classifier_eval.py"
      - "scripts/test_security_classifier_eval.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/security-ingress-contract.yml"
      - "BUILD.bazel"
      - "MODULE.bazel.lock"
      - "codex-rs/Cargo.lock"
      - "codex-rs/Cargo.toml"
      - "codex-rs/content-security/**"
      - "qa/security-levels/ingress-contract/**"
      - "qa/security-levels/classifier/**"
      - "qa/security-levels/planning/openclaw-2026-08-28/source-manifest.json"
      - "qa/security-levels/sprints/PF-34-S04/**"
      - "qa/security-levels/sprints/PF-35-S01/**"
      - "scripts/security-classifier-eval"
      - "scripts/security_classifier_eval.py"
      - "scripts/test_security_classifier_eval.py"

permissions:
  contents: read

jobs:
  verify:
    name: Ingress contract / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Verify immutable fixtures and regression harness
        shell: bash
        run: |
          set -euo pipefail
          fixture="qa/security-levels/ingress-contract/fixtures/benign-v1/raw.txt"
          attributes="$(git check-attr text eol -- "$fixture")"
          printf '%s\n' "$attributes"
          grep -F "$fixture: text: unset" <<<"$attributes"
          python qa/security-levels/ingress-contract/verify.py
          python qa/security-levels/ingress-contract/test_verify.py
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 -c qa/security-levels/sprints/PF-34-S04/lane-files.sha256
          else
            sha256sum -c qa/security-levels/sprints/PF-34-S04/lane-files.sha256
          fi
          python qa/security-levels/sprints/PF-34-S04/verify_evidence.py
      - name: Test registered Rust contract
        shell: bash
        working-directory: codex-rs
        run: cargo test -p codex-content-security
      - name: Test classifier evaluation contract
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest scripts.test_security_classifier_eval
          python scripts/security_classifier_eval.py \
            --manifest qa/security-levels/classifier/corpus-manifest.json \
            --splits qa/security-levels/classifier/split-manifest.json \
            --repo-root . \
            --output "${RUNNER_TEMP}/pf35-evaluator-smoke"
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
