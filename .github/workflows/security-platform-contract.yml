name: security-platform-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/security-platform-contract.yml"
      - "BUILD.bazel"
      - "MODULE.bazel.lock"
      - "codex-rs/Cargo.lock"
      - "codex-rs/Cargo.toml"
      - "codex-rs/secret-broker/**"
      - "scripts/security-platform-probe"
      - "scripts/security_platform_probe.py"
      - "scripts/test_security_platform_probe.py"
      - "scripts/security_platform_self_test.py"
      - "scripts/test_security_platform_self_test.py"
      - "qa/security-levels/platform/**"
      - "qa/security-levels/sprints/PF-27-S03/**"
  push:
    branches: [main]
    paths:
      - ".gitattributes"
      - ".github/workflows/security-platform-contract.yml"
      - "BUILD.bazel"
      - "MODULE.bazel.lock"
      - "codex-rs/Cargo.lock"
      - "codex-rs/Cargo.toml"
      - "codex-rs/secret-broker/**"
      - "scripts/security-platform-probe"
      - "scripts/security_platform_probe.py"
      - "scripts/test_security_platform_probe.py"
      - "scripts/security_platform_self_test.py"
      - "scripts/test_security_platform_self_test.py"
      - "qa/security-levels/platform/**"
      - "qa/security-levels/sprints/PF-27-S03/**"

permissions:
  contents: read

jobs:
  contract:
    name: contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Validate platform contract
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest scripts.test_security_platform_probe scripts.test_security_platform_self_test
          python scripts/security_platform_self_test.py
          python scripts/security_platform_probe.py --validate-evidence qa/security-levels/sprints/PF-27-S03/results/linux.json
          python scripts/security_platform_probe.py --validate-evidence qa/security-levels/sprints/PF-27-S03/results/macos.json
          python scripts/security_platform_probe.py --validate-evidence qa/security-levels/sprints/PF-27-S03/results/windows.json
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-secret-broker
      - name: Require a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
