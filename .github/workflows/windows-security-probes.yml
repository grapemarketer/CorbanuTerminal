name: windows-security-probes

# PF-27-S06/S07/S08/S09: measured Windows containment probes and broker
# transport tests. They run real processes, tokens, ACLs and named pipes, so they need a
# Windows host.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-security-probes.yml"
      - ".github/actions/setup-ci/**"
      - "codex-rs/Cargo.lock"
      - "codex-rs/Cargo.toml"
      - "codex-rs/process-hardening/**"
      - "codex-rs/utils/pty/src/win/**"
      - "codex-rs/windows-sandbox-rs/**"
      - "codex-rs/network-proxy/src/credential_broker/**"
      - "codex-rs/network-proxy/src/credential_broker.rs"
      - "codex-rs/network-proxy/src/native_certs.rs"
      - "codex-rs/network-proxy/src/upstream*.rs"
      - "codex-rs/network-proxy/Cargo.toml"
      - "codex-rs/secret-broker/src/ipc.rs"
      - "codex-rs/secret-broker/src/ipc_tests.rs"
      - "codex-rs/secrets/src/**"
      - "codex-rs/login/src/auth/**"
      - "codex-rs/vault/src/lib.rs"
      - "codex-rs/arg0/src/lib.rs"
      - "codex-rs/http-client/src/model_broker_route.rs"
      - "codex-rs/http-client/src/transport.rs"
      - "codex-rs/http-client/src/transport_tests.rs"
      - "codex-rs/core/src/model_broker_auth.rs"
      - "codex-rs/core/src/model_broker_auth_tests.rs"
      - "codex-rs/core/src/security/**"
      - "codex-rs/core/src/exec.rs"
      - "codex-rs/core/src/tools/sandboxing.rs"
      - "codex-rs/core/src/tools/sandboxing_windows_tests.rs"
      - "codex-rs/core/src/tools/sandboxing_tests.rs"
      - "codex-rs/core/src/sandboxing/**"
      - "codex-rs/sandboxing/src/windows.rs"
      - "codex-rs/protocol/src/permissions.rs"
      - "codex-rs/config/src/loader/mod.rs"
      - "codex-rs/config/src/planted_project_metadata.rs"
      - "codex-rs/sandboxing/src/lib.rs"
      - ".github/scripts/run-at-medium-integrity.ps1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-security-probes.yml"
      - ".github/actions/setup-ci/**"
      - "codex-rs/Cargo.lock"
      - "codex-rs/Cargo.toml"
      - "codex-rs/process-hardening/**"
      - "codex-rs/utils/pty/src/win/**"
      - "codex-rs/windows-sandbox-rs/**"
      - "codex-rs/network-proxy/src/credential_broker/**"
      - "codex-rs/network-proxy/src/credential_broker.rs"
      - "codex-rs/network-proxy/src/native_certs.rs"
      - "codex-rs/network-proxy/src/upstream*.rs"
      - "codex-rs/network-proxy/Cargo.toml"
      - "codex-rs/secret-broker/src/ipc.rs"
      - "codex-rs/secret-broker/src/ipc_tests.rs"
      - "codex-rs/secrets/src/**"
      - "codex-rs/login/src/auth/**"
      - "codex-rs/vault/src/lib.rs"
      - "codex-rs/arg0/src/lib.rs"
      - "codex-rs/http-client/src/model_broker_route.rs"
      - "codex-rs/http-client/src/transport.rs"
      - "codex-rs/http-client/src/transport_tests.rs"
      - "codex-rs/core/src/model_broker_auth.rs"
      - "codex-rs/core/src/model_broker_auth_tests.rs"
      - "codex-rs/core/src/security/**"
      - "codex-rs/core/src/exec.rs"
      - "codex-rs/core/src/tools/sandboxing.rs"
      - "codex-rs/core/src/tools/sandboxing_windows_tests.rs"
      - "codex-rs/core/src/tools/sandboxing_tests.rs"
      - "codex-rs/core/src/sandboxing/**"
      - "codex-rs/sandboxing/src/windows.rs"
      - "codex-rs/protocol/src/permissions.rs"
      - "codex-rs/config/src/loader/mod.rs"
      - "codex-rs/config/src/planted_project_metadata.rs"
      - "codex-rs/sandboxing/src/lib.rs"
      - ".github/scripts/run-at-medium-integrity.ps1"

permissions:
  contents: read

concurrency:
  group: windows-security-probes-${{ github.ref }}
  # Keep runs on main as evidence; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # #158: the legacy (unelevated) sandbox keeps deletes inside writable roots,
  # and labels them Low only while a session uses them (option (b)); #733:
  # its commands can't start children outside their job; #1507: nor, on the
  # hosted runner, through WMI, the Task Scheduler or ShellWindows; D283:
  # nested .codex/.agents are watched and protected.
  LEGACY_158_TESTS: >-
    legacy_workspace_write_delete_is_limited_to_writable_roots
    legacy_read_only_cannot_delete_anything
    legacy_workspace_write_can_delete_inside_writable_roots
    legacy_workspace_write_cannot_delete_or_replace_protected_git_dir
    legacy_workspace_write_cannot_move_ancestor_of_nested_carve_out
    legacy_delete_child_denies_are_removed_after_the_session
    legacy_delete_child_denies_follow_live_sessions
    legacy_planted_project_metadata_survives_a_crash
    legacy_delete_child_denies_nested_root_keeps_its_own
    legacy_read_only_after_workspace_write_cannot_delete
    legacy_crashed_session_labels_are_repaired
    legacy_label_registry_is_closed_to_low_integrity
    legacy_unlabelled_root_is_reported_until_labelled
    legacy_writable_roots_are_the_labelled_roots
    legacy_command_cannot_break_away_from_its_job
    launch_paths::legacy_launch_plain_child_stays_in_session
    launch_paths::legacy_launch_through_wmi_stays_in_session
    launch_paths::legacy_launch_through_task_scheduler_stays_in_session
    launch_paths::legacy_launch_through_com_shell_windows_stays_in_session
    launch_paths::legacy_launch_under_another_session_process_stays_in_session
    command_identity::legacy_command_cannot_write_to_another_commands_process
    command_identity::legacy_command_keeps_write_access_to_its_own_processes
    command_identity::legacy_command_tools_work_with_command_identity
    nested_metadata::legacy_nested_project_metadata_is_watched
    nested_metadata::legacy_nested_project_metadata_survives_a_crash
    nested_metadata::legacy_workspace_write_cannot_change_nested_project_metadata
    nested_metadata::legacy_unlistable_folder_counts_as_planted
    nested_metadata::legacy_temp_root_is_not_watched_for_nested_metadata
    nested_metadata::legacy_workspace_stays_watched_when_temp_resolves_to_it
    nested_metadata::legacy_configured_project_metadata_the_sandbox_makes_is_not_planted
    nested_metadata::legacy_top_level_git_is_watched
    nested_metadata::legacy_command_creating_git_is_recorded_as_planted
    carve_out_link::legacy_link_above_read_only_path_stops_the_command
    carve_out_link::legacy_link_above_read_only_path_leaves_its_target_unchanged
    carve_out_link::legacy_read_only_path_that_is_a_link_stops_the_command
    carve_out_link::legacy_read_only_path_through_a_linked_root_keeps_its_ancestors
    carve_out_link::link_above_carve_out_finds_links_below_the_root
    carve_out_link::legacy_top_level_project_metadata_link_stops_the_command
    carve_out_link::legacy_missing_read_only_path_is_created_and_protected
    carve_out_link::legacy_read_only_path_under_temp_root_is_protected
    carve_out_link::legacy_writable_folder_inside_read_only_one_with_the_profile_alone
    cloud_placeholder::legacy_cloud_placeholders_at_or_above_a_read_only_path_cannot_be_moved
    cloud_placeholder::legacy_cloud_placeholder_root_gets_its_label_back
    cloud_placeholder::legacy_nested_project_metadata_in_cloud_placeholders_is_watched

jobs:
  probes:
    name: pf_27_s06 probes (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Process access probes
        shell: bash
        run: cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-process-hardening -- pf_27_s06 pf_27_s07 --nocapture --test-threads=1
      - name: Broker token probes (PF-27-S08)
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-process-hardening --lib pf_27_s08 -- --nocapture --test-threads=1
      - name: CODEX_HOME deny removal
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib pf_27_s07 -- --nocapture --test-threads=1
      - name: D263 deny that can't be written (#1542 item 3)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- --exact acl::tests::d263_delete_deny_that_cannot_be_written_is_an_error --nocapture --test-threads=1 2>&1 | tee d263-1542.log
          grep -q "test result: ok. 1 passed" d263-1542.log
          rm d263-1542.log
      - name: D283 nested project metadata (#1541), D332 top-level .git
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- nested_metadata::tests:: --nocapture --test-threads=1 2>&1 | tee d283-1541.log
          grep -q "test result: ok. 4 passed" d283-1541.log
          rm d283-1541.log
      - name: Configured read-only paths the legacy backend makes (#1686, #1708)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- --exact spawn_prep::tests::explicit_read_only_paths_include_missing_ones resolved_permissions::tests::temp_root_carries_explicit_read_only_paths_inside_it --nocapture --test-threads=1 2>&1 | tee d1686.log
          grep -q "test result: ok. 2 passed" d1686.log
          rm d1686.log
      - name: A .git the default sandbox makes on the way is protected from the first command (#1758)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- --exact setup::tests::payload_deny_write_paths_protect_metadata_made_on_the_way allow::tests::metadata_made_on_the_way_skips_writable_and_existing_folders --nocapture --test-threads=1 2>&1 | tee d1758.log
          grep -q "test result: ok. 2 passed" d1758.log
          rm d1758.log
      - name: D261 denies without the tree walk match it (D285, #1542 item 6)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- acl::delete_child::tests::d285_ --nocapture --test-threads=1 2>&1 | tee d285.log
          grep -q "test result: ok. 8 passed" d285.log
          rm d285.log
      - name: D311/D313 our own walks (below-check and labels) match Windows' walk (#1542)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          # The elevated runner may create symbolic links: no link case skips.
          CORBANU_TEST_REQUIRE_SYMLINKS: "1"
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- acl::delete_child::tests::walk_equality::d311_ --nocapture --test-threads=1 2>&1 | tee d311.log
          grep -q "test result: ok. 15 passed" d311.log
          if grep -q "skipped: no symbolic link privilege" d311.log; then exit 1; fi
          # #1715: the walk corners (protected SACLs, other reparse points, a swapped root);
          # D352 (#1722): link roots go to Windows' walk.
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- acl::delete_child::tests::walk_equality::corners::d311_ --nocapture --test-threads=1 2>&1 | tee d1715.log
          grep -q "test result: ok. 8 passed" d1715.log
          if grep -q "skipped: no symbolic link privilege" d1715.log; then exit 1; fi
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- acl::walk::tests:: --nocapture --test-threads=1 2>&1 | tee d313.log
          grep -q "test result: ok. 7 passed" d313.log
          rm d311.log d1715.log d313.log
      - name: Credential file watch (#442)
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib credential_watch -- --nocapture --test-threads=1
      - name: Build the elevated sandbox helpers
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo build --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --bins
      - name: Sandbox user passwords meet Windows complexity (#1776)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --bin codex-windows-sandbox-setup -- sandbox_users::tests:: --nocapture 2>&1 | tee pw-1776.log
          grep -q 'test result: ok. 3 passed' pw-1776.log
      - name: P1 Windows hardening regressions (#301, #304, #307, #323, #341, #345)
        if: ${{ !cancelled() }}
        shell: bash
        # Elevated: the #341/#345 tests must not skip. #345 runs a command in
        # the elevated sandbox, which needs its helpers.
        env:
          CODEX_SEC_WIN_341_REQUIRE: "1"
        run: |
          set -euo pipefail
          bin_dir="${CARGO_TARGET_DIR}/debug"
          export CARGO_BIN_EXE_codex_windows_sandbox_setup="$(cygpath -w "${bin_dir}/codex-windows-sandbox-setup.exe")"
          export CARGO_BIN_EXE_codex_command_runner="$(cygpath -w "${bin_dir}/codex-command-runner.exe")"
          # The #1770 tests run in their own step below.
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib sec_win_ -- --skip sec_win_1770_ --nocapture --test-threads=1
      - name: Sandboxed command tokens stay restricted (#1770)
        if: ${{ !cancelled() }}
        shell: bash
        # A command of each backend may not write into a fresh folder in the
        # runner's D:\tmp that any signed-in account may write to (labelled
        # Low, so Low integrity can't hide it): only its restricted token
        # keeps it out.
        env:
          CODEX_SEC_WIN_341_REQUIRE: "1"
        run: |
          set -euo pipefail
          bin_dir="${CARGO_TARGET_DIR}/debug"
          export CARGO_BIN_EXE_codex_windows_sandbox_setup="$(cygpath -w "${bin_dir}/codex-windows-sandbox-setup.exe")"
          export CARGO_BIN_EXE_codex_command_runner="$(cygpath -w "${bin_dir}/codex-command-runner.exe")"
          export CODEX_SEC_WIN_1770_SHARED_ROOT="$(cygpath -w "${CI_BUILD_ROOT}/tmp")"
          for backend in legacy elevated; do
            cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- --exact "unified_exec::tests::token_boundary::sec_win_1770_${backend}_command_cannot_write_to_a_shared_folder" --nocapture --test-threads=1 2>&1 | tee sec-1770.log
            grep -q "test result: ok. 1 passed" sec-1770.log
            grep -qF "sec-win-1770 ${backend}: creating a file, creating a folder and appending were refused in ${CODEX_SEC_WIN_1770_SHARED_ROOT}\\" sec-1770.log
          done
          rm sec-1770.log
      - name: Legacy sandbox delete boundary (#158)
        if: ${{ !cancelled() }}
        shell: bash
        # One process per test: a failing legacy test poisons the lock the
        # others share.
        run: |
          set -euo pipefail
          for t in $LEGACY_158_TESTS; do
            cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- --exact "unified_exec::tests::$t" --nocapture --test-threads=1 2>&1 | tee legacy-158.log
            grep -q "test result: ok. 1 passed" legacy-158.log
          done
          rm legacy-158.log
      - name: Job breakaway limits (#733)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-utils-pty --lib win::job::tests -- --nocapture --test-threads=1 2>&1 | tee job-733.log
          # The two #733 tests by name, and no failure: the module may gain
          # tests (upstream's background-console test arrives with the sync).
          grep -q "job_without_breakaway_never_allows_it ... ok" job-733.log
          grep -q "default_job_allows_breakaway_before_and_after_preserving ... ok" job-733.log
          grep -qE "test result: ok\. [0-9]+ passed; 0 failed" job-733.log
          rm job-733.log
      - name: Broker token probes after legacy sessions (#158, PF-27-S08)
        if: ${{ !cancelled() }}
        shell: bash
        # The legacy sessions above labelled TEMP Low while they ran; once they
        # ended, the broker must again be unable to delete there. No repair
        # runs first: it would hide a release that failed to put labels back.
        run: cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-process-hardening --lib pf_27_s08 -- --nocapture --test-threads=1
      - name: P1 Windows hardening regressions (#320)
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-process-hardening --lib sec_win_ -- --nocapture --test-threads=1
      - name: Broker transport probes and broker suite over named pipes
        if: ${{ !cancelled() }}
        shell: bash
        # PF-27-S09: model auth over the pipes, vault reads and platform roots
        # under the broker token, and the environment scrub with its memory scan.
        # #390: pipe squats (exclusive before start, added instances, after a
        # broker death and restart) in `credential_broker::isolated::tests::sec_390`.
        run: cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-network-proxy --lib -- "credential_broker::isolated::" "credential_broker::env_scrub::" "native_certs::" --nocapture --test-threads=1
      - name: Core model auth through the broker (PF-27-S09)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-http-client --lib -- broker_frame_requests --nocapture --test-threads=1
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-core --lib -- model_broker_auth:: --nocapture --test-threads=1
      - name: Launch contract probes under the elevated sandbox
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="${CARGO_TARGET_DIR}/debug"
          export CARGO_BIN_EXE_codex_windows_sandbox_setup="$(cygpath -w "${bin_dir}/codex-windows-sandbox-setup.exe")"
          export CARGO_BIN_EXE_codex_command_runner="$(cygpath -w "${bin_dir}/codex-command-runner.exe")"
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-core --lib -- pf_27_s06 pf_27_s07 sec_win_300 sec_win_d331 sec_win_1506 --nocapture --test-threads=1
      # The runners are elevated, which hid #294/#295. This reruns those probes
      # with the token of an administrator's normal session (medium integrity).
      # Not covered here: a separate non-administrator account, and the
      # elevated sandbox's one-time setup from a normal session (it needs a
      # UAC answer), so the #294 probe reuses a setup recorded by an elevated
      # run of the same probe just before.
      - name: Launch probes in a normal (medium-integrity) session
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $medium = '.github/scripts/run-at-medium-integrity.ps1'
          # #1752: a temp folder secured like a real user's %LOCALAPPDATA%\Temp:
          # owned by the user, Full control (so #1689's WRITE_OWNER for Low
          # labels) for the user, SYSTEM and Administrators, nothing else. The
          # runner's D:\tmp is made elevated and inherits D:\'s ACL: any
          # signed-in account may read it and create in it, and the user may
          # lack WRITE_OWNER there.
          $user = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $temp = Join-Path $env:RUNNER_TEMP 'medium-temp'
          New-Item -ItemType Directory $temp -ErrorAction Stop | Out-Null
          icacls $temp /setowner "*$user" /Q | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "setting the owner of $temp failed" }
          # A fresh DACL, protected, replaces the inherited one. An
          # `icacls /inheritance:r /grant:r` attempt (which removes inherited
          # entries; `/inheritance:d` is the one that copies them) still left
          # an explicit CREATOR OWNER entry in CI (run 42397202004).
          $full = [Security.AccessControl.FileSystemRights]::FullControl
          $inherit = [Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit'
          $dacl = New-Object Security.AccessControl.DirectorySecurity
          $dacl.SetAccessRuleProtection($true, $false)
          foreach ($s in @($user, 'S-1-5-18', 'S-1-5-32-544')) {
            $dacl.AddAccessRule((New-Object Security.AccessControl.FileSystemAccessRule(
              (New-Object Security.Principal.SecurityIdentifier($s)), $full, $inherit, 'None', 'Allow')))
          }
          [IO.Directory]::SetAccessControl($temp, $dacl)
          $acl = Get-Acl -LiteralPath $temp
          $sid = { param($id) $id.Translate([Security.Principal.SecurityIdentifier]).Value }
          $entries = @($acl.Access | ForEach-Object {
            if ($_.AccessControlType -ne 'Allow' -or $_.IsInherited -or ($_.FileSystemRights -band $full) -ne $full -or
                $_.InheritanceFlags -ne $inherit -or $_.PropagationFlags -ne 'None') { throw "unexpected entry on ${temp}: $($_ | Out-String)" }
            & $sid $_.IdentityReference
          } | Sort-Object)
          $expected = @($user, 'S-1-5-18', 'S-1-5-32-544' | Sort-Object)
          if (-not $acl.AreAccessRulesProtected -or (Compare-Object $entries $expected) -or (& $sid $acl.GetOwner([Security.Principal.SecurityIdentifier])) -ne $user) {
            throw "$temp is not secured like a user's temp folder: $($acl.Sddl)"
          }
          "TEMP for this step: $temp ($($acl.Sddl))"
          $env:TEMP = $temp
          $env:TMP = $temp
          if ([IO.Path]::GetTempPath().TrimEnd('\') -ne $temp) { throw "TEMP was not switched to $temp" }
          # Until here Actions' 'Stop' makes any failure in the check above
          # fatal. 'Stop' also turns cargo's stderr into errors in Windows
          # PowerShell; native commands are checked through $LASTEXITCODE.
          $ErrorActionPreference = 'Continue'
          function Get-TestExe([string[]]$CargoArgs) {
            $artifacts = cargo test --locked --manifest-path codex-rs/Cargo.toml @CargoArgs --no-run --message-format=json
            if ($LASTEXITCODE -ne 0) { throw "cargo test --no-run failed" }
            ($artifacts | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.executable } | Select-Object -Last 1).executable
          }
          # A filter that matches nothing passes; require the probes to exist.
          function Assert-Tests([string]$Exe, [string]$Filter, [int]$Count) {
            $found = @(& $Exe --list --format terse $Filter | Where-Object { $_ -like '*: test' }).Count
            if ($found -ne $Count) { throw "expected $Count tests matching $Filter, found $found" }
          }
          $whoami = & $medium -Program "$env:SystemRoot\System32\whoami.exe" -Arguments @('/groups')
          $whoami | Select-String 'Mandatory Level|S-1-5-32-544'
          if (-not ($whoami -match 'Medium Mandatory Level')) { throw "the normal-session token is not medium integrity" }
          $bin = Join-Path $env:CARGO_TARGET_DIR 'debug'
          $env:CARGO_BIN_EXE_codex_windows_sandbox_setup = Join-Path $bin 'codex-windows-sandbox-setup.exe'
          $env:CARGO_BIN_EXE_codex_command_runner = Join-Path $bin 'codex-command-runner.exe'
          $env:CODEX_PF27S06_SETUP_SEED = Join-Path $env:RUNNER_TEMP 'pf27s06-seed'
          $env:CODEX_PF27S06_EXPECT_MEDIUM = '1'
          $env:CODEX_PF27S06_REQUIRE_LOGON = '1'
          # A throwaway local user for the #295 probe; its password is random and never printed.
          $bytes = New-Object byte[] 24
          (New-Object Security.Cryptography.RNGCryptoServiceProvider).GetBytes($bytes)
          $password = [Convert]::ToBase64String($bytes) + 'a1!'
          Write-Output "::add-mask::$password"
          $passwordFile = Join-Path $env:RUNNER_TEMP 'pf27s06-logon.txt'
          New-LocalUser -Name pf27s06logon -Password (ConvertTo-SecureString $password -AsPlainText -Force) -PasswordNeverExpires -ErrorAction Stop | Out-Null
          try {
            [IO.File]::WriteAllText($passwordFile, $password)
            $env:CODEX_PF27S06_LOGON_USER = 'pf27s06logon'
            $env:CODEX_PF27S06_LOGON_PASSWORD_FILE = $passwordFile
            $d1 = Get-TestExe @('-p', 'codex-process-hardening', '--test', 'pf_27_s06_d1_logon_launch')
            Assert-Tests $d1 'pf_27_s06_d1' 1
            & $medium -Program $d1 -Arguments @('--nocapture', '--test-threads=1')
            if ($LASTEXITCODE -ne 0) { throw "#295 probe failed in a normal session" }
            $sandbox = Get-TestExe @('-p', 'codex-windows-sandbox', '--lib')
            # The D324 tests skip here: no elevated setup is recorded yet.
            Assert-Tests $sandbox 'sec_win_' 45
            # The #1770 tests run on their own below.
            & $medium -Program $sandbox -Arguments @('sec_win_', '--skip', 'sec_win_1770_', '--nocapture', '--test-threads=1')
            if ($LASTEXITCODE -ne 0) { throw "P1 hardening regressions failed in a normal session" }
            # D324 (#1648): the elevated backend from a normal session. Each test
            # reuses the setup an elevated run recorded right before it.
            # The ignored #1560 borrow test runs only on request.
            $d324Ignored = @(& $sandbox --list --ignored --format terse 'sec_win_1648_' | Where-Object { $_ -like '*: test' } | ForEach-Object { $_ -replace ': test$', '' })
            $d324 = @(& $sandbox --list --format terse 'sec_win_1648_' | Where-Object { $_ -like '*: test' } | ForEach-Object { $_ -replace ': test$', '' } | Where-Object { $d324Ignored -notcontains $_ })
            if ($d324.Count -ne 8) { throw "expected 8 D324 tests, found $($d324.Count)" }
            New-Item -ItemType Directory -Force $env:CODEX_PF27S06_SETUP_SEED | Out-Null
            foreach ($t in $d324) {
              & $sandbox --exact 'unified_exec::tests::command_identity::elevated::sec_win_1648_elevated_command_keeps_write_access_to_its_own_processes' --nocapture --test-threads=1 | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "recording the elevated setup for $t failed" }
              $env:CODEX_SEC_WIN_1648_REQUIRE = '1'
              $out = & $medium -Program $sandbox -Arguments @('--exact', $t, '--nocapture', '--test-threads=1')
              $code = $LASTEXITCODE
              Remove-Item Env:CODEX_SEC_WIN_1648_REQUIRE
              $out
              if ($code -ne 0) { throw "D324 $t failed in a normal session" }
              if (-not ($out -match 'test result: ok\. 1 passed')) { throw "D324 $t did not run in a normal session" }
            }
            # #1758: the elevated backend's first command, from a normal session.
            # Only this run catches the bug: in the elevated step the one-time
            # setup makes .git before the per-command refresh, which then
            # finds it. Here, as for users, the setup is already recorded.
            $t1758 = 'unified_exec::tests::command_identity::elevated::sec_win_1758_elevated_first_command_cannot_write_a_git_made_for_its_hooks'
            Assert-Tests $sandbox $t1758 1
            & $sandbox --exact 'unified_exec::tests::command_identity::elevated::sec_win_1648_elevated_command_keeps_write_access_to_its_own_processes' --nocapture --test-threads=1 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "recording the elevated setup for #1758 failed" }
            $env:CODEX_SEC_WIN_1648_REQUIRE = '1'
            $out = & $medium -Program $sandbox -Arguments @('--exact', $t1758, '--nocapture', '--test-threads=1')
            $code = $LASTEXITCODE
            Remove-Item Env:CODEX_SEC_WIN_1648_REQUIRE
            $out
            if ($code -ne 0) { throw "#1758 failed in a normal session" }
            if (-not ($out -match 'test result: ok\. 1 passed')) { throw "#1758 did not run in a normal session" }
            # #1770: a command of each backend may not write into a fresh
            # folder in the runner's D:\tmp (not this step's TEMP) that any
            # signed-in account may write to; only its restricted token keeps
            # it out. The elevated one reuses a setup recorded right before.
            $env:CODEX_SEC_WIN_1770_SHARED_ROOT = Join-Path $env:CI_BUILD_ROOT 'tmp'
            foreach ($backend in @('legacy', 'elevated')) {
              $t = "unified_exec::tests::token_boundary::sec_win_1770_${backend}_command_cannot_write_to_a_shared_folder"
              Assert-Tests $sandbox $t 1
              if ($backend -eq 'elevated') {
                & $sandbox --exact 'unified_exec::tests::command_identity::elevated::sec_win_1648_elevated_command_keeps_write_access_to_its_own_processes' --nocapture --test-threads=1 | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "recording the elevated setup for $t failed" }
                $env:CODEX_SEC_WIN_1648_REQUIRE = '1'
              }
              $out = & $medium -Program $sandbox -Arguments @('--exact', $t, '--nocapture', '--test-threads=1')
              $code = $LASTEXITCODE
              Remove-Item -ErrorAction SilentlyContinue Env:CODEX_SEC_WIN_1648_REQUIRE
              $out
              if ($code -ne 0) { throw "#1770 $backend failed in a normal session" }
              $refused = "sec-win-1770 ${backend}: creating a file, creating a folder and appending were refused in $($env:CODEX_SEC_WIN_1770_SHARED_ROOT)\"
              if (-not ($out -match 'test result: ok\. 1 passed') -or -not ($out | Where-Object { $_.Contains($refused) })) {
                throw "#1770 $backend did not run in a normal session"
              }
            }
            Remove-Item Env:CODEX_SEC_WIN_1770_SHARED_ROOT
            foreach ($t in $env:LEGACY_158_TESTS.Split(' ')) {
              Assert-Tests $sandbox "unified_exec::tests::$t" 1
              $out = & $medium -Program $sandbox -Arguments @('--exact', "unified_exec::tests::$t", '--nocapture', '--test-threads=1')
              $code = $LASTEXITCODE
              $out
              if ($code -ne 0) { throw "#158 $t failed in a normal session" }
              # An ignored test passes with nothing run.
              if (-not ($out -match 'test result: ok\. 1 passed')) { throw "#158 $t did not run in a normal session" }
            }
            Assert-Tests $sandbox 'acl::tests::d263_delete_deny_that_cannot_be_written_is_an_error' 1
            $out = & $medium -Program $sandbox -Arguments @('--exact', 'acl::tests::d263_delete_deny_that_cannot_be_written_is_an_error', '--nocapture', '--test-threads=1')
            $code = $LASTEXITCODE
            $out
            if ($code -ne 0) { throw "#1542 item 3 failed in a normal session" }
            if (-not ($out -match 'test result: ok\. 1 passed')) { throw "#1542 item 3 did not run in a normal session" }
            Assert-Tests $sandbox 'acl::delete_child::tests::d285_' 8
            & $medium -Program $sandbox -Arguments @('acl::delete_child::tests::d285_', '--nocapture', '--test-threads=1')
            if ($LASTEXITCODE -ne 0) { throw "D285 ACL comparison failed in a normal session" }
            Assert-Tests $sandbox 'acl::delete_child::tests::walk_equality::d311_' 15
            & $medium -Program $sandbox -Arguments @('acl::delete_child::tests::walk_equality::d311_', '--nocapture', '--test-threads=1')
            if ($LASTEXITCODE -ne 0) { throw "D311 walk comparison failed in a normal session" }
            Assert-Tests $sandbox 'acl::delete_child::tests::walk_equality::corners::d311_' 8
            & $medium -Program $sandbox -Arguments @('acl::delete_child::tests::walk_equality::corners::d311_', '--nocapture', '--test-threads=1')
            if ($LASTEXITCODE -ne 0) { throw "#1715 walk corners failed in a normal session" }
            Assert-Tests $sandbox 'acl::walk::tests::' 7
            & $medium -Program $sandbox -Arguments @('acl::walk::tests::', '--nocapture', '--test-threads=1')
            if ($LASTEXITCODE -ne 0) { throw "D313 handle-relative walk tests failed in a normal session" }
            Assert-Tests $sandbox 'credential_watch' 18
            & $medium -Program $sandbox -Arguments @('credential_watch', '--nocapture', '--test-threads=1')
            if ($LASTEXITCODE -ne 0) { throw "#442 credential watch failed in a normal session" }
            $hardening = Get-TestExe @('-p', 'codex-process-hardening', '--lib')
            Assert-Tests $hardening 'sec_win_' 2
            & $medium -Program $hardening -Arguments @('sec_win_', '--nocapture', '--test-threads=1')
            if ($LASTEXITCODE -ne 0) { throw "#320 regressions failed in a normal session" }
            Assert-Tests $hardening 'pf_27_s08' 7
            & $medium -Program $hardening -Arguments @('pf_27_s08', '--nocapture', '--test-threads=1')
            if ($LASTEXITCODE -ne 0) { throw "PF-27-S08 broker token probes failed in a normal session" }
            $proxy = Get-TestExe @('-p', 'codex-network-proxy', '--lib')
            Assert-Tests $proxy 'pf_27_s06_windows_broker_uses_pipes' 1
            Assert-Tests $proxy 'pf_27_s09' 12
            Assert-Tests $proxy 'pf_27_s05_raw_key_is_not_left_in_core_memory' 1
            # Six #390 probes plus the entry point their child processes run.
            Assert-Tests $proxy 'credential_broker::isolated::tests::sec_390::' 7
            Assert-Tests $proxy 'sec_390_control_pipe_drops_a_foreign_client' 1
            & $medium -Program $proxy -Arguments @('credential_broker::isolated::', 'credential_broker::env_scrub::', 'native_certs::', '--nocapture', '--test-threads=1')
            if ($LASTEXITCODE -ne 0) { throw "the broker suite failed in a normal session" }
            $core = Get-TestExe @('-p', 'codex-core', '--lib')
            Assert-Tests $core 'pf_27_s06_d2' 2
            # #300: the unelevated sandbox, which a normal session uses by default.
            Assert-Tests $core 'sec_win_300' 2
            & $medium -Program $core -Arguments @('sec_win_300', '--nocapture', '--test-threads=1')
            if ($LASTEXITCODE -ne 0) { throw "#300 regressions failed in a normal session" }
            # D331: the agent path refuses a writable folder inside a read-only one.
            Assert-Tests $core 'sec_win_d331' 1
            & $medium -Program $core -Arguments @('sec_win_d331', '--nocapture', '--test-threads=1')
            if ($LASTEXITCODE -ne 0) { throw "D331 agent-path refusal failed in a normal session" }
            # #1506 item 2: planted .codex/.agents aren't loaded until confirmed.
            Assert-Tests $core 'sec_win_1506' 1
            & $medium -Program $core -Arguments @('sec_win_1506', '--nocapture', '--test-threads=1')
            if ($LASTEXITCODE -ne 0) { throw "#1506 planted-metadata regression failed in a normal session" }
            # Each elevated setup resets the sandbox passwords, so record the
            # setup the normal-session run reuses right before it.
            New-Item -ItemType Directory -Force $env:CODEX_PF27S06_SETUP_SEED | Out-Null
            & $core 'pf_27_s06_d2_vault' --nocapture --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw "#294 probe failed elevated" }
            & $medium -Program $core -Arguments @('pf_27_s06_d2', '--nocapture', '--test-threads=1')
            if ($LASTEXITCODE -ne 0) { throw "#294 probes failed in a normal session" }
          } finally {
            try { Remove-LocalUser -Name pf27s06logon -ErrorAction Stop } catch { Write-Warning "remove pf27s06logon: $_" }
            Remove-Item -ErrorAction SilentlyContinue $passwordFile
          }
      - name: Require a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
