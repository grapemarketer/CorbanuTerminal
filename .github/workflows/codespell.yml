# Codespell configuration is within .codespellrc
---
name: Codespell

on:
  workflow_call:

permissions:
  contents: read

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Annotate locations with typos
        uses: codespell-project/codespell-problem-matcher@b80729f885d32f78a716c2f107b4db1025001c42 # v1.1.0
      # codespell-project/actions-codespell is a Docker action whose image
      # pulls python:3.13-alpine from Docker Hub anonymously, which hits the
      # unauthenticated pull rate limit on shared runners. Run the same
      # codespell release on the runner instead, with the same arguments.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install codespell
        shell: bash
        # The pin lives in this workflow, not a repository file: pull_request
        # runs use the merged workflow but check out the PR head, so a PR
        # branched before this change has no requirements file to read.
        # 2.4.3 is what codespell-project/actions-codespell@v2.2 resolved
        # (codespell[toml]>=2.2.4) when this was pinned.
        run: |
          set -euo pipefail
          req="${RUNNER_TEMP}/codespell-requirements.txt"
          printf '%s\n' \
            'codespell==2.4.3 --hash=sha256:af2505b335e8573dbd2d384d1c4ef498f4006f4ba2d6fceca01e55b91f52628a' \
            > "${req}"
          python -m pip install --disable-pip-version-check --no-deps \
            --only-binary :all: --require-hashes -r "${req}"
      - name: Codespell
        shell: bash
        run: |
          set +e
          # Matches actions-codespell@v2.2 with ignore_words_file:
          # .codespellignore and its default skip (./.git). codespell reads
          # .codespellrc from the repository root itself.
          codespell --count --ignore-words .codespellignore --skip ./.git
          status=$?
          # Like the action, stop annotating once codespell has finished.
          echo "::remove-matcher owner=codespell-matcher-default::"
          echo "::remove-matcher owner=codespell-matcher-specified::"
          exit "${status}"

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
