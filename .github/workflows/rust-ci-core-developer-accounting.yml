name: rust-ci core developer-accounting tests

# codex-core's tests (lib and integration) built with the `developer-accounting`
# feature, which records every usage report in the cost ledger. No other job
# builds codex-core tests with it, so a feature-only failure (#546) went
# unnoticed. It is a full codex-core build and test run, so it runs nightly
# (nightly-ci.yml), not on pull requests.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: "cargo nextest codex-core --features developer-accounting"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs
    env:
      # sccache cannot cache incremental compilations.
      CARGO_INCREMENTAL: "0"
      # Bounded: one cache within the repository quota.
      SCCACHE_CACHE_SIZE: 2G
      # Tests must never reach the runner's OS keyring.
      CORBANU_TEST_NO_NATIVE_KEYRING: "1"
      RUST_BACKTRACE: "1"
      RUST_MIN_STACK: "8388608" # 8 MiB
      # As the developer-accounting `corbanu` build: the TUI's ledger views
      # need the feature too.
      CLI_FEATURES: codex-core/developer-accounting,codex-tui/developer-accounting
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      # bubblewrap: the integration tests run commands in the Linux sandbox,
      # as rust-ci-full's nextest job does.
      - name: Install Linux build dependencies
        working-directory: .
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev bubblewrap
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache
          version: 0.7.5
      - name: Configure sccache
        id: sccache_config
        run: |
          set -euo pipefail
          {
            echo "SCCACHE_DIR=${CI_BUILD_ROOT}/sccache"
            echo "RUSTC_WRAPPER=$(command -v sccache)"
          } >> "$GITHUB_ENV"
          echo "lockhash=$(cat Cargo.lock rust-toolchain.toml | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore sccache cache
        id: sccache_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-core-devacct-${{ steps.sccache_config.outputs.lockhash }}-${{ github.run_id }}
          restore-keys: |
            sccache-core-devacct-${{ steps.sccache_config.outputs.lockhash }}-
            sccache-core-devacct-

      # Binaries the integration tests start: the CLI (`cli_stream`), the
      # Linux sandbox, the code-mode host and the MCP test servers. Built with
      # the same features, as a developer-accounting `corbanu` would be.
      - name: Build test helper binaries
        run: |
          set -euo pipefail
          cargo build --locked --features "${CLI_FEATURES}" \
            -p codex-cli --bin codex \
            -p codex-linux-sandbox --bin codex-linux-sandbox
          # Neither depends on codex-core.
          cargo build --locked -p codex-code-mode-host -p codex-rmcp-client --bins

      - name: Disk space after the helper builds
        run: df -h . "${CARGO_TARGET_DIR}"

      - name: "cargo nextest codex-core --features developer-accounting"
        run: |
          set -euo pipefail
          sandbox_helper="${CARGO_TARGET_DIR}/debug/codex-linux-sandbox"
          env \
            "CARGO_BIN_EXE_codex-linux-sandbox=${sandbox_helper}" \
            "CARGO_BIN_EXE_codex_linux_sandbox=${sandbox_helper}" \
            cargo nextest run --locked --no-fail-fast \
              -p codex-core --features developer-accounting

      - name: Upload the nextest report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nextest-core-developer-accounting
          path: ${{ env.CARGO_TARGET_DIR }}/nextest/default/junit.xml
          if-no-files-found: ignore

      # Only main saves caches; branch runs restore main's (#636).
      - name: Save sccache cache
        if: always() && !cancelled() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-core-devacct-${{ steps.sccache_config.outputs.lockhash }}-${{ github.run_id }}

      - name: sccache stats
        if: always()
        continue-on-error: true
        run: sccache --show-stats || true

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
