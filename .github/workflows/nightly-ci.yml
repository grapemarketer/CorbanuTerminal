name: nightly-ci

# Cold Bazel jobs (Linux test, clippy and release verify; Linux and macOS
# argument comment lint; the SDK build) take close to their 180-minute limit without a remote cache, so they run here
# once a day instead of blocking every PR. So do codex-core's tests built with
# `developer-accounting`, a full extra codex-core build (#546). Failures here do
# not block merges; check this workflow before cutting a release.
on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-ci::${{ github.ref }}
  cancel-in-progress: true

# Read-only token: only the `commit` job calls the GitHub API (read-only).
permissions:
  contents: read

jobs:
  # #1812: a nightly on main must test the commit main pointed to when the run
  # was created. Fails if it doesn't; warns when main hasn't moved for over a
  # day (the 10-29..11-06 nightlies all retested 1329ea5883 because main
  # didn't change) or moved after the run was created (a re-run).
  commit:
    name: Nightly commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # main's Activity API
      actions: read # this run's creation time
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check the tested commit is main's head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_nightly_commit.py

  bazel:
    name: Bazel
    uses: ./.github/workflows/bazel.yml
    with:
      cold_bazel: true
    secrets: inherit

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml
    with:
      cold_bazel: true
    secrets: inherit

  sdk:
    name: sdk
    uses: ./.github/workflows/sdk.yml
    with:
      cold_bazel: true
    secrets: inherit

  core_developer_accounting:
    name: codex-core developer-accounting tests
    uses: ./.github/workflows/rust-ci-core-developer-accounting.yml

  price_calendars:
    name: Price catalogue calendars
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Fails 30 days before a dated price list (DeepSeek's off-peak holidays)
      # runs out, so the next year's dates are added before they are needed.
      - name: Check price catalogue calendars
        run: python3 scripts/check_price_calendars.py

  results:
    name: Nightly CI results
    if: ${{ always() }}
    needs:
      - commit
      - bazel
      - rust-ci
      - sdk
      - core_developer_accounting
      - price_calendars
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
