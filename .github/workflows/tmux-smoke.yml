name: tmux smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmux-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tmux-smoke:
    name: Ubuntu tmux smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    env:
      CORBANU_TMUX_ARTIFACT_DIR: ${{ github.workspace }}/tmux-artifacts
      CORBANU_TMUX_REQUIRED: "1"
      # sccache cannot cache incremental compilations.
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 3G
      # Keep the server (and its stats) alive through the long test step.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103
      # Local-disk sccache persisted with actions/cache, as in
      # rust-ci-full-nextest-platform.yml's fallback path.
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache
          version: 0.7.5
      - name: Configure sccache
        id: sccache_config
        run: |
          set -euo pipefail
          {
            echo "SCCACHE_DIR=${CI_BUILD_ROOT}/sccache"
            echo "RUSTC_WRAPPER=$(command -v sccache)"
          } >> "$GITHUB_ENV"
          echo "lockhash=$(cat Cargo.lock rust-toolchain.toml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore sccache cache
        id: sccache_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-tmux-smoke-${{ runner.os }}-${{ steps.sccache_config.outputs.lockhash }}-${{ github.run_id }}
          restore-keys: |
            sccache-tmux-smoke-${{ runner.os }}-${{ steps.sccache_config.outputs.lockhash }}-
            sccache-tmux-smoke-${{ runner.os }}-
      - name: Install tmux prerequisites
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libcap-dev \
            pkg-config \
            tmux
          tmux -V
      # Same package set as the helper build in scripts/isolated_rust_tests.py,
      # so `just test` reuses these artifacts instead of resolving different
      # features and rebuilding most of the workspace. Includes corbanu-walletd,
      # which onboarding scenarios launch from beside the candidate binary.
      - name: Build candidate and helper binaries
        run: cargo build --locked -p codex-cli -p codex-wallet-daemon -p codex-rmcp-client -p codex-code-mode-host --bins
      - name: Build tmux test binary
        run: cargo nextest run --locked --no-run -p codex-tui --test all
      - name: Run focused tmux tests
        run: |
          started=$SECONDS
          just test -p codex-tui --test all tmux --retries 0
          echo "tmux smoke runtime: $((SECONDS - started))s"
      # Only main saves caches; PRs and branch runs restore main's (#636).
      - name: Save sccache cache
        if: always() && !cancelled() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-tmux-smoke-${{ runner.os }}-${{ steps.sccache_config.outputs.lockhash }}-${{ github.run_id }}
      - name: sccache stats
        if: always()
        continue-on-error: true
        run: |
          sccache --show-stats || true
          du -sh "${SCCACHE_DIR}" || true
          df -h . || true
      - name: Upload tmux failure artifacts
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tmux-smoke-${{ github.sha }}
          path: tmux-artifacts/
          if-no-files-found: warn
