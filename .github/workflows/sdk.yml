name: sdk

on:
  workflow_call:
    inputs:
      cold_bazel:
        description: >-
          Run the Bazel-built SDK job. Its cold build takes close to 180 minutes
          without a remote cache, so blocking PR CI skips it and nightly-ci.yml
          runs it.
        type: boolean
        default: false

# Read-only token: none of these jobs call the GitHub API.
permissions:
  contents: read

jobs:
  python-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Test Python SDK
        shell: bash
        run: |
          set -euo pipefail

          # Run inside a glibc Linux image so dependency resolution exercises
          # the pinned manylinux runtime wheel that users install.
          # Pull the official image from the ECR Public mirror (same digest as
          # Docker Hub's python:3.12-slim) to avoid Docker Hub's anonymous
          # pull rate limit on shared runners. ECR Public also throttles
          # anonymous pulls ("toomanyrequests"), so retry with backoff and
          # fall back to Google's Docker Hub mirror; the digest pins the
          # same image either way.
          digest=sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
          image=""
          for attempt in 1 2 3 4 5 6; do
            for registry in public.ecr.aws/docker/library mirror.gcr.io/library; do
              if docker pull --quiet "${registry}/python@${digest}"; then
                image="${registry}/python@${digest}"
                break 2
              fi
            done
            sleep $((attempt * 10))
          done
          if [[ -z "${image}" ]]; then
            echo "::error::could not pull python:3.12-slim (${digest}) from any mirror"
            exit 1
          fi

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/codex-python-sdk-home \
            -e UV_LINK_MODE=copy \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}/sdk/python" \
            "${image}" \
            sh -euxc '
              python -m venv /tmp/uv
              /tmp/uv/bin/python -m pip install uv==0.11.3
              /tmp/uv/bin/uv sync --group dev --frozen
              /tmp/uv/bin/uv run --frozen --no-sync ruff check --output-format=github .
              /tmp/uv/bin/uv run --frozen --no-sync ruff format --check .
              /tmp/uv/bin/uv run --frozen --no-sync pytest
            '

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  # D287 (#1605): the Bazel `sdks` job below is too slow for PRs, so a PR could
  # change the TypeScript SDK or `codex exec` (#1373) without these tests
  # running. On PRs that touch sdk/typescript/**, codex-rs/exec/** or this
  # workflow, build the CLI with Cargo and run them. A skipped job leaves the
  # `sdk` call successful, so it blocks `CI required` only when it runs.
  typescript-sdk-changed:
    name: Detect TypeScript SDK changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")"
          run=false
          while IFS= read -r f; do
            [[ $f == sdk/typescript/* || $f == codex-rs/exec/* || $f == .github/workflows/sdk.yml ]] && run=true
          done <<< "$files"
          echo "TypeScript SDK tests: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  typescript-sdk:
    name: TypeScript SDK
    needs: typescript-sdk-changed
    if: ${{ needs.typescript-sdk-changed.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CORBANU_TEST_NO_NATIVE_KEYRING: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      # Same binaries the Bazel job stages: the CLI and its code-mode host,
      # side by side in one folder.
      - name: Build codex with Cargo
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked \
            --manifest-path codex-rs/Cargo.toml \
            --profile dev-small \
            --bin codex \
            --bin codex-code-mode-host
          echo "CODEX_EXEC_PATH=${GITHUB_WORKSPACE}/codex-rs/target/dev-small/codex" >> "$GITHUB_ENV"

      - name: Warm up Cargo-built codex
        shell: bash
        run: |
          set -euo pipefail
          "${CODEX_EXEC_PATH}" --version

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK packages
        run: pnpm -r --filter ./sdk/typescript run build

      - name: Lint SDK packages
        run: pnpm -r --filter ./sdk/typescript run lint

      - name: Test SDK packages
        run: pnpm -r --filter ./sdk/typescript run test

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  sdks:
    if: ${{ inputs.cold_bazel }}
    runs-on: ubuntu-24.04
    # Fork and secretless PRs build locally instead of using BuildBuddy remote
    # execution. A cold local Bazel build can exceed ten minutes before the SDK
    # tests begin. Cold builds now compile V8 transitively and can exceed 90
    # minutes, so keep enough headroom for the build and SDK process matrix.
    timeout-minutes: 360
    environment:
      name: bazel
      deployment: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Linux bwrap build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # setup-node can't restore without saving, so only main caches (#636).
          cache: ${{ github.ref == 'refs/heads/main' && 'pnpm' || '' }}

      - name: Set up Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: sdk

      - name: Build codex with Bazel
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # Use the shared CI wrapper so fork PRs fall back cleanly when
          # BuildBuddy credentials are unavailable. This workflow needs the
          # built `codex` binary on disk afterwards, so ask the wrapper to
          # override CI's default remote_download_minimal behavior.
          ./.github/scripts/run-bazel-ci.sh \
            --remote-download-toplevel \
            -- \
            build \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
            --build_metadata=TAG_job=sdk \
            -- \
            //codex-rs/cli:codex \
            //codex-rs/code-mode-host:codex-code-mode-host

          # Stage the CLI and every adjacent runtime companion used by the
          # product defaults. SDK tests spawn the CLI directly many times, so
          # this directory must have the same executable layout as a package.
          install_dir="${GITHUB_WORKSPACE}/.tmp/sdk-ci"
          mkdir -p "${install_dir}"

          stage_bazel_binary() {
            local target="$1"
            local output_name="$2"
            local cquery_output
            local bazel_output_path

            cquery_output="$(
              ./.github/scripts/run-bazel-ci.sh \
                -- \
                cquery \
                --output=files \
                -- \
                "${target}" \
                | grep -E '^(/|bazel-out/)' \
                | tail -n 1
            )"
            if [[ -z "${cquery_output}" ]]; then
              echo "Bazel did not report an output path for ${target}." >&2
              exit 1
            fi
            if [[ "${cquery_output}" = /* ]]; then
              bazel_output_path="${cquery_output}"
            else
              bazel_output_path="${GITHUB_WORKSPACE}/${cquery_output}"
            fi
            if [[ ! -e "${bazel_output_path}" ]]; then
              echo "Unable to locate ${target} at ${bazel_output_path}." >&2
              exit 1
            fi
            install -m 755 "${bazel_output_path}" "${install_dir}/${output_name}"
          }

          stage_bazel_binary //codex-rs/cli:codex codex
          stage_bazel_binary \
            //codex-rs/code-mode-host:codex-code-mode-host \
            codex-code-mode-host
          echo "CODEX_EXEC_PATH=${install_dir}/codex" >> "$GITHUB_ENV"

      - name: Warm up Bazel-built codex
        shell: bash
        run: |
          set -euo pipefail
          "${CODEX_EXEC_PATH}" --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK packages
        run: pnpm -r --filter ./sdk/typescript run build

      - name: Lint SDK packages
        run: pnpm -r --filter ./sdk/typescript run lint

      - name: Test SDK packages
        run: pnpm -r --filter ./sdk/typescript run test

      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: bazel-cache-x86_64-unknown-linux-gnu-${{ hashFiles('MODULE.bazel', 'codex-rs/Cargo.lock', 'codex-rs/Cargo.toml') }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
