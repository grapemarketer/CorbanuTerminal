name: rust-ci
on:
  workflow_call:
    inputs:
      cold_bazel:
        description: >-
          Run the Linux and macOS argument comment lint. Their cold Bazel builds
          take close to 180 minutes without a remote cache, so blocking PR CI
          skips them and nightly-ci.yml runs them.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      cold_bazel:
        description: Run the Linux and macOS argument comment lint.
        type: boolean
        default: true

jobs:
  # --- Detect what changed so the fast PR workflow only runs relevant jobs ----
  changed:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      argument_comment_lint: ${{ steps.detect.outputs.argument_comment_lint }}
      argument_comment_lint_package: ${{ steps.detect.outputs.argument_comment_lint_package }}
      argument_comment_lint_packages: ${{ steps.detect.outputs.argument_comment_lint_packages }}
      app_server_schema: ${{ steps.detect.outputs.app_server_schema }}
      codex: ${{ steps.detect.outputs.codex }}
      windows_native_tests: ${{ steps.detect.outputs.windows_native_tests }}
      workflows: ${{ steps.detect.outputs.workflows }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths (no external action)
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA='${{ github.event.pull_request.base.sha }}'
            HEAD_SHA='${{ github.event.pull_request.head.sha }}'
            echo "Base SHA: $BASE_SHA"
            echo "Head SHA: $HEAD_SHA"
            mapfile -d '' -t files < <(git diff --name-only -z --no-renames "$BASE_SHA" "$HEAD_SHA")
            diff_pid=$!
            wait "$diff_pid"
          else
            # On manual runs, default to the full fast-PR bundle.
            files=("codex-rs/force" "tools/argument-comment-lint/force" ".github/force")
          fi

          codex=false
          argument_comment_lint=false
          argument_comment_lint_package=false
          workflows=false
          # Native Windows tests run only on PRs that change these crates
          # (or this job's own workflow). Main pushes and nightly get the
          # forced file list above, which matches none of them; nightly runs
          # every crate's native Windows tests in bazel.yml instead.
          windows_native_tests=false
          # Schema fixture tests run on PRs that change the protocol crates,
          # a crate whose types they export (security-policy, absolute-path,
          # path-uri, ext/items), the experimental API macros, the workspace
          # manifest or lockfile, or this workflow; postmerge rust-ci-full
          # runs them on main.
          app_server_schema=false
          for f in "${files[@]}"; do
            [[ $f == codex-rs/* ]] && codex=true
            [[ $f == codex-rs/* || $f == tools/argument-comment-lint/* || $f == justfile ]] && argument_comment_lint=true
            [[ $f == defs.bzl || $f == workspace_root_test_launcher.sh.tpl || $f == workspace_root_test_launcher.bat.tpl ]] && argument_comment_lint=true
            [[ $f == tools/argument-comment-lint/* || $f == .github/workflows/rust-ci.yml || $f == .github/workflows/rust-ci-full.yml ]] && argument_comment_lint_package=true
            [[ $f == .github/* ]] && workflows=true
            [[ $f == codex-rs/tui/* || $f == codex-rs/core/* || $f == codex-rs/state/* || $f == codex-rs/login/* ]] && windows_native_tests=true
            [[ $f == .github/workflows/rust-ci-windows-native-tests.yml ]] && windows_native_tests=true
            [[ $f == codex-rs/protocol/* || $f == codex-rs/app-server-protocol/* || $f == .github/workflows/rust-ci.yml ]] && app_server_schema=true
            [[ $f == codex-rs/security-policy/* || $f == codex-rs/utils/absolute-path/* || $f == codex-rs/utils/path-uri/* || $f == codex-rs/ext/items/* ]] && app_server_schema=true
            [[ $f == codex-rs/codex-experimental-api-macros/* || $f == codex-rs/Cargo.toml || $f == codex-rs/Cargo.lock ]] && app_server_schema=true
          done

          echo "argument_comment_lint=$argument_comment_lint" >> "$GITHUB_OUTPUT"
          echo "argument_comment_lint_package=$argument_comment_lint_package" >> "$GITHUB_OUTPUT"

          # Crates whose Rust sources the PR changed (#636); empty otherwise.
          packages=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            packages="$(python3 .github/scripts/argument_comment_lint_packages.py "$BASE_SHA" "$HEAD_SHA" | tr '\n' ' ')"
          fi
          echo "Argument comment lint packages: ${packages:-none}"
          echo "argument_comment_lint_packages=${packages% }" >> "$GITHUB_OUTPUT"
          echo "app_server_schema=$app_server_schema" >> "$GITHUB_OUTPUT"
          echo "codex=$codex" >> "$GITHUB_OUTPUT"
          echo "windows_native_tests=$windows_native_tests" >> "$GITHUB_OUTPUT"
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  # --- Fast Cargo-native PR checks -------------------------------------------
  general:
    name: Format / etc
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Rust benchmark smoke test
        run: just bench-smoke

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  cargo_shear:
    name: cargo shear
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2
      - name: cargo shear
        run: cargo shear --deny-warnings

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  # Linux clippy (`--tests -D warnings`) catches Linux-only lint errors
  # (cfg(target_os = "linux") code) before merge. Same job definition as the
  # postmerge rust-ci-full Lint/Build matrix; musl and release stay postmerge.
  lint_build_linux:
    name: Lint/Build — ubuntu-24.04 - x86_64-unknown-linux-gnu
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' }}
    uses: ./.github/workflows/rust-ci-lint-build.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      profile: dev
      timeout_minutes: 20
      save_caches: false
    secrets: inherit

  # Windows clippy (`--tests -D warnings`, #717): cfg(unix)/cfg(target_os =
  # "linux") gating mistakes (unused imports, dead helpers, needless `mut`)
  # only show up when linting for Windows; they broke main six times on
  # 2026-10-13. Same leg and cache keys as postmerge rust-ci-full, so it
  # restores the caches main saves (~12 minutes warm, ~15 cold). Like every
  # PR job it saves none of its own (#636); postmerge saves main's.
  lint_build_windows:
    name: Lint/Build — windows-2022 - x86_64-pc-windows-msvc
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' }}
    uses: ./.github/workflows/rust-ci-lint-build.yml
    with:
      runner: windows-2022
      target: x86_64-pc-windows-msvc
      profile: dev
      timeout_minutes: 60
      save_caches: false
    secrets: inherit

  # codex-core security unit tests, Linux and macOS (#512): before this no PR
  # job ran codex-core tests, and no job at all ran them on macOS.
  core_security_tests:
    name: Core security tests — ${{ matrix.runner }}
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' }}
    uses: ./.github/workflows/rust-ci-core-security.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      # postmerge rust-ci-full saves the macOS cache for the same commit.
      save_cache: ${{ matrix.runner != 'macos-15' }}
    secrets: inherit

  # Native Windows Bazel tests of codex-tui, codex-core, codex-state and
  # codex-login on PRs that change one of them (#636, owner decision
  # 2026-10-15): Windows-only test failures in these crates broke nightly
  # after merging. Restore-only, like every PR job.
  windows_native_tests:
    name: Windows native tests
    needs: changed
    if: ${{ needs.changed.outputs.windows_native_tests == 'true' }}
    uses: ./.github/workflows/rust-ci-windows-native-tests.yml
    secrets: inherit

  # codex-app-server-protocol schema fixture tests on PRs that change
  # codex-protocol, codex-app-server-protocol or a crate whose types they
  # export (#1165), or schema-generation inputs (#1298). Only postmerge
  # rust-ci-full ran them, so a changed protocol type or doc comment without
  # `just write-app-server-schema` turned main red (#1140, fixed by #1164).
  app_server_schema_fixtures:
    name: App-server schema fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changed
    if: ${{ needs.changed.outputs.app_server_schema == 'true' }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: cargo test codex-app-server-protocol schema_fixtures
        run: cargo test --locked -p codex-app-server-protocol --lib schema_fixtures

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  argument_comment_lint_package:
    name: Argument comment lint package
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ needs.changed.outputs.argument_comment_lint_package == 'true' }}
    env:
      CARGO_DYLINT_VERSION: 6.1.1
      DYLINT_LINK_VERSION: 6.1.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Install nightly argument-comment-lint toolchain
        shell: bash
        run: |
          rustup toolchain install nightly-2026-08-08 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rustc-dev \
            --component rust-src \
            --no-self-update
          rustup default nightly-2026-08-08
      - name: Restore cargo-dylint tooling
        id: cargo_dylint_cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: argument-comment-lint-${{ runner.os }}-${{ env.CARGO_DYLINT_VERSION }}-${{ env.DYLINT_LINK_VERSION }}-${{ hashFiles('tools/argument-comment-lint/Cargo.lock', 'tools/argument-comment-lint/rust-toolchain', '.github/workflows/rust-ci.yml', '.github/workflows/rust-ci-full.yml') }}
          # The key hashes this workflow, so PRs editing it still find main's
          # binaries (the versions are in the prefix).
          restore-keys: |
            argument-comment-lint-${{ runner.os }}-${{ env.CARGO_DYLINT_VERSION }}-${{ env.DYLINT_LINK_VERSION }}-
      - name: Install cargo-dylint tooling
        if: ${{ steps.cargo_dylint_cache.outputs.cache-matched-key == '' }}
        shell: bash
        run: |
          cargo install --locked cargo-dylint --version "$CARGO_DYLINT_VERSION"
          cargo install --locked dylint-link --version "$DYLINT_LINK_VERSION"
      - name: Check Python wrapper syntax
        run: python3 -m py_compile tools/argument-comment-lint/wrapper_common.py tools/argument-comment-lint/run.py tools/argument-comment-lint/run-prebuilt-linter.py tools/argument-comment-lint/test_wrapper_common.py
      - name: Test Python wrapper helpers
        run: python3 -m unittest discover -s tools/argument-comment-lint -p 'test_*.py'
      - name: Test argument comment lint package
        working-directory: tools/argument-comment-lint
        run: cargo test
        env:
          RUST_MIN_STACK: "8388608" # 8 MiB
      # Only main saves caches; PRs restore main's (#636). The changed-crates
      # lint below restores this one too.
      - name: Save cargo-dylint tooling
        if: always() && !cancelled() && steps.cargo_dylint_cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cargo_dylint_cache.outputs.cache-primary-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  # Argument comment lint, test code included, on the crates a PR changed
  # (#636). The Windows Bazel lint below skips test targets and the full Linux
  # and macOS lints run only nightly, so new literals in tests used to land on
  # main unnoticed. Restore-only caches: main saves the cargo-home and
  # cargo-dylint ones.
  argument_comment_lint_changed:
    name: Argument comment lint - changed crates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changed
    if: ${{ needs.changed.outputs.argument_comment_lint_packages != '' }}
    env:
      CARGO_DYLINT_VERSION: 6.1.1
      DYLINT_LINK_VERSION: 6.1.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Install nightly argument-comment-lint toolchain
        shell: bash
        run: |
          rustup toolchain install nightly-2026-08-08 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rustc-dev \
            --component rust-src \
            --no-self-update
          rustup default nightly-2026-08-08
      - name: Compute lockfile hash
        id: lockhash
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(sha256sum Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(sha256sum rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # Main's Linux clippy cache (rust-ci-lint-build.yml). The key and the
      # path list must match it exactly: the path list is part of the cache
      # version, so a shorter list never matches.
      - name: Restore cargo home cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/.cargo-home/bin/
            ${{ github.workspace }}/.cargo-home/registry/index/
            ${{ github.workspace }}/.cargo-home/registry/cache/
            ${{ github.workspace }}/.cargo-home/git/db/
          key: cargo-home-ubuntu-24.04-x86_64-unknown-linux-gnu-dev-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            cargo-home-ubuntu-24.04-x86_64-unknown-linux-gnu-dev-
      - name: Restore cargo-dylint tooling
        id: cargo_dylint_cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: argument-comment-lint-${{ runner.os }}-${{ env.CARGO_DYLINT_VERSION }}-${{ env.DYLINT_LINK_VERSION }}-${{ hashFiles('tools/argument-comment-lint/Cargo.lock', 'tools/argument-comment-lint/rust-toolchain', '.github/workflows/rust-ci.yml', '.github/workflows/rust-ci-full.yml') }}
          restore-keys: |
            argument-comment-lint-${{ runner.os }}-${{ env.CARGO_DYLINT_VERSION }}-${{ env.DYLINT_LINK_VERSION }}-
      - name: Install cargo-dylint tooling
        if: ${{ steps.cargo_dylint_cache.outputs.cache-matched-key == '' }}
        shell: bash
        run: |
          cargo install --locked cargo-dylint --version "$CARGO_DYLINT_VERSION"
          cargo install --locked dylint-link --version "$DYLINT_LINK_VERSION"
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Lint the changed crates, tests included
        shell: bash
        env:
          PACKAGES: ${{ needs.changed.outputs.argument_comment_lint_packages }}
        run: |
          set -euo pipefail
          args=()
          for package in $PACKAGES; do
            args+=(-p "$package")
          done
          echo "Linting: $PACKAGES"
          python3 tools/argument-comment-lint/run.py "${args[@]}" -- --keep-going

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  argument_comment_lint_prebuilt:
    name: Argument comment lint - ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    needs: changed
    environment:
      name: bazel
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            timeout_minutes: 360
          - name: macOS
            runner: macos-15
            timeout_minutes: 360
          - name: Windows
            runner: windows-2022
            timeout_minutes: 180
    steps:
      - name: Check whether argument comment lint should run
        id: argument_comment_lint_gate
        shell: bash
        env:
          ARGUMENT_COMMENT_LINT: ${{ needs.changed.outputs.argument_comment_lint }}
          WORKFLOWS: ${{ needs.changed.outputs.workflows }}
          PLATFORM: ${{ matrix.name }}
          COLD_BAZEL: ${{ inputs.cold_bazel }}
        run: |
          if [[ "$PLATFORM" != "Windows" && "$COLD_BAZEL" != "true" ]]; then
            echo "$PLATFORM argument comment lint runs in nightly-ci.yml."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$ARGUMENT_COMMENT_LINT" == "true" || "$WORKFLOWS" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No argument-comment-lint relevant changes."
          echo "run=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' }}
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run argument comment lint on codex-rs via Bazel
        if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' }}
        uses: ./.github/actions/run-argument-comment-lint
        with:
          target: ${{ runner.os }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Check for a clean worktree
        if: always() && !cancelled() && steps.argument_comment_lint_gate.outputs.run == 'true'
        uses: ./.github/actions/check-clean-worktree

  # --- Gatherer job that you mark as the ONLY required status -----------------
  results:
    name: CI results (required)
    needs:
      [
        changed,
        general,
        cargo_shear,
        lint_build_linux,
        lint_build_windows,
        core_security_tests,
        windows_native_tests,
        app_server_schema_fixtures,
        argument_comment_lint_package,
        argument_comment_lint_changed,
        argument_comment_lint_prebuilt,
      ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize
        shell: bash
        run: |
          echo "argpkg : ${{ needs.argument_comment_lint_package.result }}"
          echo "argcrat: ${{ needs.argument_comment_lint_changed.result }}"
          echo "arglint: ${{ needs.argument_comment_lint_prebuilt.result }}"
          echo "general: ${{ needs.general.result }}"
          echo "shear  : ${{ needs.cargo_shear.result }}"
          echo "lint   : ${{ needs.lint_build_linux.result }}"
          echo "winlint: ${{ needs.lint_build_windows.result }}"
          echo "coresec: ${{ needs.core_security_tests.result }}"
          echo "winnat : ${{ needs.windows_native_tests.result }}"
          echo "schema : ${{ needs.app_server_schema_fixtures.result }}"

          # Every decision below reads its outputs.
          [[ '${{ needs.changed.result }}' == 'success' ]] || { echo 'changed failed'; exit 1; }

          # If nothing relevant changed (PR touching only root README, etc.),
          # declare success regardless of other jobs.
          if [[ "${NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT}" != 'true' && "${NEEDS_CHANGED_OUTPUTS_CODEX}" != 'true' && "${NEEDS_CHANGED_OUTPUTS_WORKFLOWS}" != 'true' ]]; then
            echo 'No relevant changes -> CI not required.'
            exit 0
          fi

          # Required whenever it runs (PRs touching tui, core, state, login).
          if [[ "${NEEDS_CHANGED_OUTPUTS_WINDOWS_NATIVE_TESTS}" == 'true' ]]; then
            [[ '${{ needs.windows_native_tests.result }}' == 'success' ]] || { echo 'windows_native_tests failed'; exit 1; }
          fi

          # Required whenever it runs (PRs touching schema crates or generator inputs).
          if [[ "${NEEDS_CHANGED_OUTPUTS_APP_SERVER_SCHEMA}" == 'true' ]]; then
            [[ '${{ needs.app_server_schema_fixtures.result }}' == 'success' ]] || { echo 'app_server_schema_fixtures failed'; exit 1; }
          fi

          if [[ "${NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT_PACKAGE}" == 'true' ]]; then
            [[ '${{ needs.argument_comment_lint_package.result }}' == 'success' ]] || { echo 'argument_comment_lint_package failed'; exit 1; }
          fi

          if [[ -n "${NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT_PACKAGES}" ]]; then
            [[ '${{ needs.argument_comment_lint_changed.result }}' == 'success' ]] || { echo 'argument_comment_lint_changed failed'; exit 1; }
          fi

          if [[ "${NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT}" == 'true' || "${NEEDS_CHANGED_OUTPUTS_WORKFLOWS}" == 'true' ]]; then
            [[ '${{ needs.argument_comment_lint_prebuilt.result }}' == 'success' ]] || { echo 'argument_comment_lint_prebuilt failed'; exit 1; }
          fi

          if [[ "${NEEDS_CHANGED_OUTPUTS_CODEX}" == 'true' || "${NEEDS_CHANGED_OUTPUTS_WORKFLOWS}" == 'true' ]]; then
            [[ '${{ needs.general.result }}' == 'success' ]] || { echo 'general failed'; exit 1; }
            [[ '${{ needs.cargo_shear.result }}' == 'success' ]] || { echo 'cargo_shear failed'; exit 1; }
            [[ '${{ needs.lint_build_linux.result }}' == 'success' ]] || { echo 'lint_build_linux failed'; exit 1; }
            [[ '${{ needs.lint_build_windows.result }}' == 'success' ]] || { echo 'lint_build_windows failed'; exit 1; }
            [[ '${{ needs.core_security_tests.result }}' == 'success' ]] || { echo 'core_security_tests failed'; exit 1; }
          fi
        env:
          NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT: ${{ needs.changed.outputs.argument_comment_lint }}
          NEEDS_CHANGED_OUTPUTS_CODEX: ${{ needs.changed.outputs.codex }}
          NEEDS_CHANGED_OUTPUTS_WORKFLOWS: ${{ needs.changed.outputs.workflows }}
          NEEDS_CHANGED_OUTPUTS_WINDOWS_NATIVE_TESTS: ${{ needs.changed.outputs.windows_native_tests }}
          NEEDS_CHANGED_OUTPUTS_APP_SERVER_SCHEMA: ${{ needs.changed.outputs.app_server_schema }}
          NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT_PACKAGE: ${{ needs.changed.outputs.argument_comment_lint_package }}
          NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT_PACKAGES: ${{ needs.changed.outputs.argument_comment_lint_packages }}
