name: repo-checks

on:
  workflow_call:

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Cold npm staging downloads six native artifacts (~4 GiB); allow transfer
    # headroom on runs that stage the full package (main pushes and PRs that
    # touch packaging inputs, see "Detect packaging changes" below).
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      # Version written into the staged npm packages (both staging steps).
      CODEX_VERSION: 0.149.0-alpha.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Verify codex-rs Cargo manifests inherit workspace settings
        run: python3 .github/scripts/verify_cargo_workspace_manifests.py

      - name: Verify codex-tui does not import codex-core directly
        run: python3 .github/scripts/verify_tui_core_boundary.py

      - name: Verify Bazel clippy flags match Cargo workspace lints
        run: python3 .github/scripts/verify_bazel_clippy_lints.py

      # These ran only inside the Linux Bazel test job, which is now nightly.
      - name: Check rusty_v8 MODULE.bazel checksums
        run: python3 .github/scripts/rusty_v8_bazel.py check-module-bazel

      - name: Test GitHub scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Test Codex package builder
        run: python3 -m unittest discover -s scripts/codex_package -p 'test_*.py'

      - name: Test standalone installer
        run: python3 -m unittest discover -s scripts/install -p 'test_*.py'

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full staging downloads ~4 GiB of native artifacts, so PRs run it only
      # when they change a packaging input (#1420, idea by @citadelculture in
      # #1382). Every other event (main pushes, manual runs) always stages.
      # The job still runs and succeeds when the steps are skipped, so `CI
      # required` keeps seeing a real result for repo-checks. The diff is
      # two-dot (base tip vs. PR head), a superset of the PR's own changes.
      # Any detection failure falls back to full staging.
      - name: Detect packaging changes
        id: packaging
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT_NAME run: full npm staging."
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA" \
            || ! changed="$(git -c core.quotePath=false diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")"; then
            echo "::warning::Could not diff $BASE_SHA..$HEAD_SHA; running full npm staging."
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          full=false
          while IFS= read -r f; do
            case "$f" in
              codex-cli/* | scripts/stage_npm_packages.py \
                | package.json | pnpm-lock.yaml | pnpm-workspace.yaml | .npmrc \
                | .github/workflows/repo-checks.yml | .github/workflows/blocking-ci.yml \
                | .github/actions/*)
                echo "Packaging input changed: $f"
                full=true
                ;;
            esac
          done <<< "$changed"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Full npm staging: $full"

      # Without full staging, still build and pack the root npm package (no
      # native payload) so changes to its bundled README.md, mkdocs.yml and
      # docs/ are checked on every PR.
      - name: Pack root npm package (no native artifacts)
        if: steps.packaging.outputs.full != 'true'
        run: |
          set -euo pipefail
          python3 ./codex-cli/scripts/build_npm_package.py \
            --package codex \
            --version "$CODEX_VERSION" \
            --pack-output "${RUNNER_TEMP}/codex-npm-root.tgz"

      - name: Stage npm package
        id: stage_npm_package
        if: steps.packaging.outputs.full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Use a recent successful rust-release run that published the full
          # cross-platform native payload required by the npm package layout.
          # Passing the workflow URL directly avoids relying on old rust-v*
          # branches remaining discoverable via `gh run list --branch ...`.
          WORKFLOW_URL="https://github.com/openai/codex/actions/runs/32199727293"
          OUTPUT_DIR="${RUNNER_TEMP}"
          python3 ./scripts/stage_npm_packages.py \
            --release-version "$CODEX_VERSION" \
            --workflow-url "$WORKFLOW_URL" \
            --package codex \
            --output-dir "$OUTPUT_DIR"
          PACK_OUTPUT="${OUTPUT_DIR}/codex-npm-${CODEX_VERSION}.tgz"
          echo "pack_output=$PACK_OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload staged npm package artifact
        if: steps.packaging.outputs.full == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-npm-staging
          path: ${{ steps.stage_npm_package.outputs.pack_output }}

      - name: Ensure root README.md contains only ASCII and certain Unicode code points
        run: ./scripts/asciicheck.py README.md
      - name: Check root README ToC
        run: python3 scripts/readme_toc.py README.md

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
          # Only main saves caches; PRs restore main's (#636).
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting (run `just fmt` to fix)
        run: just fmt-check

      - name: Prettier (run `pnpm run format:fix` to fix)
        run: pnpm run format

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
