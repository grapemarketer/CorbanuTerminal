name: rust-ci-full
on:
  workflow_call:
  push:
    branches:
      # Main pushes enter through postmerge-ci. Keep this opt-in branch trigger
      # for developers who want the full suite before merging.
      - "**full-ci**"
  workflow_dispatch:

jobs:
  # --- CI that doesn't need specific targets ---------------------------------
  general:
    name: Format / etc
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Rust benchmark smoke test
        run: just bench-smoke

  cargo_shear:
    name: cargo shear
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2
      - name: cargo shear
        run: cargo shear --deny-warnings

  argument_comment_lint_package:
    name: Argument comment lint package
    runs-on: ubuntu-24.04
    env:
      CARGO_DYLINT_VERSION: 6.1.1
      DYLINT_LINK_VERSION: 6.1.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: nightly-2026-08-08
          components: llvm-tools-preview, rustc-dev, rust-src
      - name: Restore cargo-dylint tooling
        id: cargo_dylint_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: argument-comment-lint-${{ runner.os }}-${{ env.CARGO_DYLINT_VERSION }}-${{ env.DYLINT_LINK_VERSION }}-${{ hashFiles('tools/argument-comment-lint/Cargo.lock', 'tools/argument-comment-lint/rust-toolchain', '.github/workflows/rust-ci.yml', '.github/workflows/rust-ci-full.yml') }}
      - name: Install cargo-dylint tooling
        if: ${{ steps.cargo_dylint_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          cargo install --locked cargo-dylint --version "$CARGO_DYLINT_VERSION"
          cargo install --locked dylint-link --version "$DYLINT_LINK_VERSION"
      - name: Check Python wrapper syntax
        run: python3 -m py_compile tools/argument-comment-lint/wrapper_common.py tools/argument-comment-lint/run.py tools/argument-comment-lint/run-prebuilt-linter.py tools/argument-comment-lint/test_wrapper_common.py
      - name: Test Python wrapper helpers
        run: python3 -m unittest discover -s tools/argument-comment-lint -p 'test_*.py'
      - name: Test argument comment lint package
        working-directory: tools/argument-comment-lint
        run: cargo test
        env:
          RUST_MIN_STACK: "8388608" # 8 MiB
      # Only main saves caches; branch dispatches restore main's (#636).
      - name: Save cargo-dylint tooling
        if: always() && !cancelled() && steps.cargo_dylint_cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cargo_dylint_cache.outputs.cache-primary-key }}

  # The Bazel argument comment lint is not repeated here: a cold Bazel build
  # (V8 from source) takes hours without a BuildBuddy cache, so the Linux and
  # macOS lint runs in nightly-ci.yml (rust-ci.yml with cold_bazel) instead.

  # --- CI to validate on different os/targets --------------------------------
  lint_build:
    name: Lint/Build — ${{ matrix.runner }} - ${{ matrix.target }}${{ matrix.profile == 'release' && ' (release)' || '' }}
    uses: ./.github/workflows/rust-ci-lint-build.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            profile: dev
          # Blocking PR CI (rust-ci.yml) also runs this gnu dev leg.
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            profile: dev

          # Also run a representative release build because there could be
          # release-only build errors we want to catch.
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            profile: release

          # Windows clippy: cfg(unix)/cfg(target_os = "linux") gating mistakes
          # (dead code, unused imports) only show up when linting for Windows.
          # Blocking PR CI (rust-ci.yml) also runs this leg (#717).
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            profile: dev
            timeout_minutes: 60
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      profile: ${{ matrix.profile }}
      timeout_minutes: ${{ matrix.timeout_minutes || 30 }}
    secrets: inherit

  tests_linux_x64_remote:
    name: Tests — ubuntu-24.04 - x86_64-unknown-linux-gnu
    uses: ./.github/workflows/rust-ci-full-nextest-platform.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      profile: ci-test
      artifact_id: linux-x64
      # Docker remote-executor mode (upstream's "(remote)" lane), re-enabled
      # after the remote-only failures from
      # https://github.com/CorbanuCore/CorbanuTerminal/issues/157 were repaired.
      remote_env: true
      use_sccache: true
    secrets: inherit

  # Linux runs codex-core's security tests in the suite above; macOS runs
  # no other codex-core tests (#512).
  core_security_tests_macos:
    name: Core security tests — macos-15
    uses: ./.github/workflows/rust-ci-core-security.yml
    with:
      runner: macos-15
      target: aarch64-apple-darwin
    secrets: inherit

  # --- Gatherer job for the full post-merge workflow --------------------------
  results:
    name: Full CI results
    needs:
      [
        general,
        cargo_shear,
        argument_comment_lint_package,
        lint_build,
        tests_linux_x64_remote,
        core_security_tests_macos,
      ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize
        shell: bash
        run: |
          echo "argpkg : ${{ needs.argument_comment_lint_package.result }}"
          echo "general: ${{ needs.general.result }}"
          echo "shear  : ${{ needs.cargo_shear.result }}"
          echo "lint   : ${{ needs.lint_build.result }}"
          echo "test linux : ${{ needs.tests_linux_x64_remote.result }}"
          echo "core security macos : ${{ needs.core_security_tests_macos.result }}"
          [[ '${{ needs.argument_comment_lint_package.result }}' == 'success' ]] || { echo 'argument_comment_lint_package failed'; exit 1; }
          [[ '${{ needs.general.result }}' == 'success' ]] || { echo 'general failed'; exit 1; }
          [[ '${{ needs.cargo_shear.result }}' == 'success' ]] || { echo 'cargo_shear failed'; exit 1; }
          [[ '${{ needs.lint_build.result }}' == 'success' ]] || { echo 'lint_build failed'; exit 1; }
          [[ '${{ needs.tests_linux_x64_remote.result }}' == 'success' ]] || { echo 'tests_linux_x64_remote failed'; exit 1; }
          [[ '${{ needs.core_security_tests_macos.result }}' == 'success' ]] || { echo 'core_security_tests_macos failed'; exit 1; }

      - name: sccache summary note
        if: always()
        run: |
          echo "Per-job sccache stats are attached to each matrix job's Step Summary."
